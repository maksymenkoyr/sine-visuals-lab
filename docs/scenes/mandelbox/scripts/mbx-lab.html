<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{width:960px;height:540px;display:block}</style></head>
<body><canvas id="c" width="960" height="540"></canvas>
<script type="module">
// Renders one Mandelbox Flight place with the scene's own modules, through the dev server at /docs/scenes/mandelbox/scripts/mbx-lab.html; lab-shot.mjs drives it.
import { createPlaceSearch, stepPlaceSearch, createFlight, advanceFlight, cameraAxes, foldScale } from "/src/render/scenes/mandelbox/flight.ts";
import { EXTRA_UNIFORMS, MARCH_BODY, FOV_TAN } from "/src/render/scenes/mandelbox/glsl.ts";
import { SETTINGS } from "/src/render/scenes/mandelbox/card.ts";
import { COMMON_UNIFORMS_GLSL, DRIVE_GLSL, ROOM_UV_GLSL, settingUniformName } from "/src/render/sceneCommon.ts";
const gl = document.getElementById("c").getContext("webgl2", { preserveDrawingBuffer: true });
const vs = `#version 300 es
layout(location = 0) in vec2 aPos; out vec2 vUv; void main() { vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const fs = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
${COMMON_UNIFORMS_GLSL}
${SETTINGS.map((s) => `uniform float ${settingUniformName(s.key)};`).join("\n")}
${DRIVE_GLSL(SETTINGS)}
${EXTRA_UNIFORMS}
${ROOM_UV_GLSL}
${MARCH_BODY}`;
const prog = gl.createProgram();
for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) { document.title = "COMPILE " + gl.getShaderInfoLog(sh); throw new Error(gl.getShaderInfoLog(sh)); }
  gl.attachShader(prog, sh);
}
gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = (n) => gl.getUniformLocation(prog, n);
window.lab = {
  show({ seed = 6, mirror = 2, roundness = 0.6, fly = 0, rate = 0.073, rims = 1, punch = 0.7, hue = 0.72, folds } = {}) {
    const place = stepPlaceSearch(createPlaceSearch(foldScale(roundness), seed, mirror), Infinity);
    const f = createFlight(place);
    for (let t = 0; t < fly; t += 0.05) advanceFlight(f, 0.05, rate, 1);
    const right = new Float32Array(3), up = new Float32Array(3);
    cameraAxes(f, right, up);
    gl.viewport(0, 0, 960, 540);
    gl.uniform2f(U("uResolution"), 960, 540);
    gl.uniform4f(U("uViewport"), 0, 0, 1, 1);
    gl.uniform3fv(U("uCamPos"), f.place.p);
    gl.uniform3fv(U("uCamFwd"), f.place.fwd);
    gl.uniform3fv(U("uCamRight"), right);
    gl.uniform3fv(U("uCamUp"), up);
    gl.uniform1f(U("uFold"), f.place.scale);
    gl.uniform1f(U("uFolds"), folds ?? f.folds);
    gl.uniform1f(U("uGap"), f.gap);
    gl.uniform1f(U("uPixel"), (2 * FOV_TAN) / 540);
    gl.uniform1f(U("uSteps"), 170);
    gl.uniform1f(U("uHueNow"), hue);
    gl.uniform1f(U("uFlashNow"), 0);
    gl.uniform1f(U("uRims"), rims);
    gl.uniform1f(U("uPunch"), punch);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.finish();
    return { kind: place.kind, gap: f.gap, ahead: f.ahead, folds: f.folds };
  },
};
window.labReady = true;
</script></body></html>
