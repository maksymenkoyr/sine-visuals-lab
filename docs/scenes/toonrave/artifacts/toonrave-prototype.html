<title>Toon Rave Prototype</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0d0409;
  --panel: #1c0a17;
  --panel-2: #2a1023;
  --line: #4a1d40;
  --text: #f6e9f2;
  --muted: #b896ad;
  --accent: #ff3fae;
  --accent-ink: #1a0614;
  --build: #9cff2e;
  --focus: #9cff2e;
  --stage-bg: #14060f;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
.app { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
.stage {
  position: relative; width: min(100%, calc((100vh - var(--bar-h, 64px) - 44px) * 16 / 9)); aspect-ratio: 16 / 9;
  background: var(--stage-bg); border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--line);
}
@supports (height: 100svh) { .stage { width: min(100%, calc((100svh - var(--bar-h, 64px) - 44px) * 16 / 9)); } }
.stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bar {
  width: 100%; max-width: 1600px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
}
button {
  font: inherit; font-weight: 600; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; min-height: 36px; white-space: nowrap;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 8.5em; }
button[aria-pressed="true"] { border-color: var(--build); color: var(--build); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.field { display: flex; align-items: center; gap: 8px; color: var(--muted); white-space: nowrap; }
.field output { color: var(--text); font-variant-numeric: tabular-nums; min-width: 4.6em; }
.field small { font-size: 12px; }
input[type=range] { accent-color: var(--accent); width: 120px; }
.phrase { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.cells { display: grid; grid-template-columns: repeat(8, 22px); gap: 3px; position: relative; padding-top: 14px; }
.cell { height: 18px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 10px; color: var(--muted); }
.cell.build { border-color: var(--build); color: var(--build); background: repeating-linear-gradient(135deg, var(--panel-2) 0 4px, #2c3a12 4px 7px); }
.cell.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cell.build.on { background: var(--build); color: var(--accent-ink); }
.cells .tag { position: absolute; top: 0; font-size: 10px; line-height: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
.tag.drop { left: 0; color: var(--accent); }
.tag.build { left: calc(6 * 25px); color: var(--build); }
.dots { display: grid; grid-template-columns: repeat(4, 9px); gap: 5px; padding-top: 14px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line); }
.dot.on { background: var(--text); border-color: var(--text); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.bare .app { padding: 0; gap: 0; } .bare .bar { display: none; } .bare .stage { width: 100vw; border-radius: 0; box-shadow: none; }
@media (max-width: 640px) {
  .app { justify-content: flex-start; }
  .phrase { margin-left: 0; }
  input[type=range] { width: 100px; }
}
</style>
<main class="app">
  <div class="stage" id="stage" role="img" aria-label="A cartoon rave: a tiny DJ slams a giant red button on the drop"></div>
  <div class="bar" id="bar">
    <button id="play" class="primary" title="Space">Play with sound</button>
    <button id="sound" aria-pressed="false" title="M">Sound off</button>
    <label class="field">Tempo <input id="tempo" type="range" min="90" max="160" step="1" value="128"> <output id="tempoOut">128 BPM</output></label>
    <button id="drop" title="D">Drop now</button>
    <label class="field">Camera cuts <small>Fewer</small><input id="cuts" type="range" min="0" max="2" step="1" value="1"><small>More</small></label>
    <div class="phrase" aria-label="Phrase: 8 bars, drop at bar 1, build in bars 7 and 8">
      <div class="cells" id="cells"><span class="tag drop">Drop</span><span class="tag build">Build</span></div>
      <div class="dots" id="dots"></div>
    </div>
    <span class="sr" id="live" aria-live="polite"></span>
  </div>
</main>
<script>
// ---- lib.js
// Drawing helpers for the Toon Rave frame, plus the prototype's glow, matrix and cel helpers.
// Characters: one thick pure-black union outline, flat fills, mitten nubs, giant eyes.
// World: thin dark-plum outlines, base + hard shadow shape + pale rim line.
const INK = '#0a0508';      // pure black
const PLUM = '#1a0614';     // background line
let LW = 7;
const DEFS = [];
let _id = 0;
const uid = (p) => `${p}${++_id}`;
const f1 = (n) => Math.round(n * 10) / 10;
let _seed = 7;
const rnd = () => { _seed = (_seed * 16807) % 2147483647; return (_seed - 1) / 2147483646; };
const xf = (x, y, rot = 0, s = 1, flip = false) => `translate(${x},${y}) rotate(${rot}) scale(${flip ? -s : s},${s})`;

// Parts with ONE outline around their union: all strokes first, then all fills, then inner.
function blob(parts, inner = '', lw = LW, ink = INK) {
  const s = parts.filter(p => !p.noOutline).map(p => `<path d="${p.d}" fill="${ink}" stroke="${ink}" stroke-width="${lw * 2}" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  const f = parts.map(p => `<path d="${p.d}" fill="${p.fill}"${p.attr ? ' ' + p.attr : ''}/>`).join('');
  return `<g>${s}${f}${inner}</g>`;
}
function shape(d, fill, lw = LW, ink = INK, extra = '') {
  return `<path d="${d}" fill="${fill}" stroke="${ink}" stroke-width="${lw * 2}" paint-order="stroke" stroke-linejoin="round" ${extra}/>`;
}
function line(d, w = LW * 0.6, col = INK, extra = '') {
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
}
const E = (cx, cy, rx, ry, rot = 0) => {
  // ellipse as a path (so it can go in blob parts)
  const c = Math.cos(rot * Math.PI / 180), s = Math.sin(rot * Math.PI / 180);
  const p = (a) => { const x = rx * Math.cos(a), y = ry * Math.sin(a); return [cx + x * c - y * s, cy + x * s + y * c]; };
  let d = '';
  const n = 48;
  for (let i = 0; i <= n; i++) { const q = p(i / n * Math.PI * 2); d += (i ? 'L' : 'M') + f1(q[0]) + ',' + f1(q[1]); }
  return d + 'Z';
};

function crSample(pts, n) {
  const P = [pts[0], ...pts, pts[pts.length - 1]];
  const out = [];
  const segs = pts.length - 1;
  for (let i = 0; i <= n; i++) {
    const t = (i / n) * segs;
    const k = Math.min(Math.floor(t), segs - 1);
    const u = t - k;
    const p0 = P[k], p1 = P[k + 1], p2 = P[k + 2], p3 = P[k + 3];
    const u2 = u * u, u3 = u2 * u;
    const c = (a, b, cc, d) => 0.5 * ((2 * b) + (-a + cc) * u + (2 * a - 5 * b + 4 * cc - d) * u2 + (-a + 3 * b - 3 * cc + d) * u3);
    out.push([c(p0[0], p1[0], p2[0], p3[0]), c(p0[1], p1[1], p2[1], p3[1]), t]);
  }
  return out;
}
function tubeD(pts, ws, n = 40, caps = [true, true]) {
  const S = crSample(pts, n);
  const wAt = (t) => {
    const k = Math.min(Math.floor(t), ws.length - 2);
    const u = t - k; const s = u * u * (3 - 2 * u);
    return ws[k] + (ws[k + 1] - ws[k]) * s;
  };
  const L = [], R = [];
  for (let i = 0; i < S.length; i++) {
    const a = S[Math.max(0, i - 1)], b = S[Math.min(S.length - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
    const w = wAt(S[i][2]) / 2;
    L.push([S[i][0] - dy * w, S[i][1] + dx * w]);
    R.push([S[i][0] + dy * w, S[i][1] - dx * w]);
  }
  const we = wAt(S[S.length - 1][2]) / 2, ws0 = wAt(0) / 2;
  let d = `M${f1(L[0][0])},${f1(L[0][1])}`;
  for (let i = 1; i < L.length; i++) d += `L${f1(L[i][0])},${f1(L[i][1])}`;
  d += caps[1] ? `A${f1(we)},${f1(we)} 0 0 0 ${f1(R[R.length - 1][0])},${f1(R[R.length - 1][1])}` : `L${f1(R[R.length - 1][0])},${f1(R[R.length - 1][1])}`;
  for (let i = R.length - 2; i >= 0; i--) d += `L${f1(R[i][0])},${f1(R[i][1])}`;
  d += caps[0] ? `A${f1(ws0)},${f1(ws0)} 0 0 0 ${f1(L[0][0])},${f1(L[0][1])}` : '';
  return d + 'Z';
}
function crPath(pts, n = 30) {
  const S = crSample(pts, n);
  return 'M' + S.map(p => `${f1(p[0])},${f1(p[1])}`).join('L');
}
// Smooth closed outline through points (Catmull-Rom loop).
function loopD(pts, n = 120) {
  const m = pts.length;
  const P = (i) => pts[(i + m) % m];
  let d = '';
  for (let i = 0; i < n; i++) {
    const t = i / n * m, k = Math.floor(t), u = t - k;
    const p0 = P(k - 1), p1 = P(k), p2 = P(k + 1), p3 = P(k + 2);
    const u2 = u * u, u3 = u2 * u;
    const c = (a, b, cc, dd) => 0.5 * ((2 * b) + (-a + cc) * u + (2 * a - 5 * b + 4 * cc - dd) * u2 + (-a + 3 * b - 3 * cc + dd) * u3);
    d += (i ? 'L' : 'M') + f1(c(p0[0], p1[0], p2[0], p3[0])) + ',' + f1(c(p0[1], p1[1], p2[1], p3[1]));
  }
  return d + 'Z';
}
const poly = (pts) => 'M' + pts.map(p => f1(p[0]) + ',' + f1(p[1])).join('L') + 'Z';

// arm: a short tapered nub from shoulder to a round mitten ball. Returns blob parts.
function toonArm(sx, sy, hx, hy, w0, wm, col, bend = 0) {
  const mx = (sx + hx) / 2, my = (sy + hy) / 2, l = Math.hypot(hx - sx, hy - sy);
  const nx = -(hy - sy) / l, ny = (hx - sx) / l;
  return [
    { d: tubeD([[sx, sy], [mx + nx * bend, my + ny * bend], [hx, hy]], [w0, w0 * 0.78, w0 * 0.62], 24), fill: col },
    { d: E(hx + (hx - sx) / l * wm * 0.25, hy + (hy - sy) / l * wm * 0.25, wm * 0.62, wm * 0.56, Math.atan2(hy - sy, hx - sx) * 180 / Math.PI), fill: col },
  ];
}
// leg: short tube hip -> ankle, white sock on the lower half, black Mary-Jane shoe pointing toeAng (deg).
function toonLeg(hx, hy, ax, ay, w, skin, toeAng, o = {}) {
  const parts = [];
  parts.push({ d: tubeD([[hx, hy], [ax, ay]], [w, w * 0.94], 10), fill: skin });
  const k = o.sockFrom ?? 0.45;
  const sx = hx + (ax - hx) * k, sy = hy + (ay - hy) * k;
  parts.push({ d: tubeD([[sx, sy], [ax, ay]], [w * 0.97, w * 0.94], 8, [false, true]), fill: o.sock || '#ffffff' });
  const ta = toeAng * Math.PI / 180;
  const cx = ax + Math.cos(ta) * w * 0.32, cy = ay + Math.sin(ta) * w * 0.32;
  parts.push({ d: E(cx, cy, w * 0.82, w * 0.55, toeAng), fill: o.shoe || INK });
  const L = Math.hypot(ax - hx, ay - hy), fx = (ax - hx) / L, fy = (ay - hy) / L;
  let inner = line(`M${f1(sx - fy * w * 0.5)},${f1(sy + fx * w * 0.5)} L${f1(sx + fy * w * 0.5)},${f1(sy - fx * w * 0.5)}`, LW * 0.5);
  if (o.stripe) for (const t of [0.6, 0.78]) {
    const qx = hx + (ax - hx) * t, qy = hy + (ay - hy) * t;
    inner += line(`M${f1(qx - fy * w * 0.47)},${f1(qy + fx * w * 0.47)} L${f1(qx + fy * w * 0.47)},${f1(qy - fx * w * 0.47)}`, w * 0.15, o.stripe, 'stroke-linecap="butt"');
  }
  const hx2 = cx + Math.cos(ta) * w * 0.25 - Math.sin(ta) * w * 0.18, hy2 = cy + Math.sin(ta) * w * 0.25 + Math.cos(ta) * -w * 0.18;
  inner += `<ellipse cx="${f1(hx2)}" cy="${f1(hy2)}" rx="${f1(w * 0.2)}" ry="${f1(w * 0.08)}" fill="#ffffff" opacity="0.9" transform="rotate(${toeAng} ${f1(hx2)} ${f1(hy2)})"/>`;
  return { parts, inner };
}

// eye: sclera ellipse, iris disc pushed toward the look direction, giant pupil, big highlight.
// The sclera is meant to go into the head's blob parts so one outline wraps head+eyes.
// opts: iris colour, look [dx,dy] (-1..1), pupilScale, pin (pinpoint pupil, no iris), lid (top lid cut angle)
function eyeParts(cx, cy, rx, ry, rot = 0) { return { d: E(cx, cy, rx, ry, rot), fill: '#ffffff' }; }
function eyeInner(cx, cy, rx, ry, rot, o = {}) {
  const id = uid('eyc');
  DEFS.push(`<clipPath id="${id}"><path d="${E(cx, cy, rx - 0.5, ry - 0.5, rot)}"/></clipPath>`);
  const look = o.look || [0, 0];
  const ir = Math.min(rx, ry) * (o.irisScale || 0.78);
  const ix = cx + look[0] * (rx - ir * 0.75), iy = cy + look[1] * (ry - ir * 0.75);
  let s = `<path d="${E(cx, cy, rx, ry, rot)}" fill="#ffffff"/><g clip-path="url(#${id})">`;
  if (o.pin) {
    // shocked: tiny pupil, no iris (a pinpoint) on the eye
    s += `<circle cx="${ix}" cy="${iy}" r="${ir * 0.16}" fill="${INK}"/>`;
  } else {
    s += `<circle cx="${ix}" cy="${iy}" r="${ir}" fill="${o.iris || '#9a5cff'}"/>`;
    s += `<circle cx="${ix}" cy="${iy}" r="${ir}" fill="none" stroke="${o.irisLine || '#4a1f7a'}" stroke-width="${LW * 0.3}"/>`;
    const pr = ir * (o.pupilScale || 0.62);
    const px = ix + look[0] * ir * 0.12, py = iy + look[1] * ir * 0.12;
    s += `<circle cx="${px}" cy="${py}" r="${pr}" fill="${INK}"/>`;
    s += `<circle cx="${px + pr * (o.hlx ?? 0.28)}" cy="${py - pr * 0.3}" r="${pr * 0.42}" fill="#ffffff"/>`;
    if (o.glint) s += `<circle cx="${px - pr * 0.38}" cy="${py + pr * 0.4}" r="${pr * 0.13}" fill="#ffffff"/>`;
  }
  if (o.lid) s += `<path d="${o.lid}" fill="${o.lidCol || '#ffd8c4'}" stroke="${INK}" stroke-width="${LW * 1.0}"/>`;
  s += `</g>`;
  if (!o.noRing) s += `<path d="${E(cx, cy, rx, ry, rot)}" fill="none" stroke="${INK}" stroke-width="${LW * 1.05}"/>`;
  return s;
}

function radial(id, stops, cx = '50%', cy = '50%', r = '50%', fx, fy, units = '') {
  DEFS.push(`<radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}"${fx ? ` fx="${fx}" fy="${fy}"` : ''}${units ? ` gradientUnits="${units}"` : ''}>${stops.map(s => `<stop offset="${s[0]}" stop-color="${s[1]}" stop-opacity="${s[2] ?? 1}"/>`).join('')}</radialGradient>`);
  return `url(#${id})`;
}
function linear(id, stops, x1 = 0, y1 = 0, x2 = 0, y2 = 1, units = '') {
  DEFS.push(`<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"${units ? ` gradientUnits="${units}"` : ''}>${stops.map(s => `<stop offset="${s[0]}" stop-color="${s[1]}" stop-opacity="${s[2] ?? 1}"/>`).join('')}</linearGradient>`);
  return `url(#${id})`;
}

// machine panel: base fill, a hard shadow shape, a thin pale rim line, thin plum outline.
function zpanel(d, base, shadowD, shade, rimD, rim, lw = 2.2) {
  let s = `<path d="${d}" fill="${base}" stroke="${PLUM}" stroke-width="${lw}" stroke-linejoin="round"/>`;
  if (shadowD) s += `<path d="${shadowD}" fill="${shade}"/>`;
  if (rimD) s += line(rimD, lw * 1.1, rim);
  return s;
}
// Motion/impact lines
function speedLines(pts, w = 3, col = INK) { return pts.map(p => line(p, w, col)).join(''); }

// Blast-lit rim (the hard second tone, flipped to light): a crescent inside shape d on the side
// facing the light. Drawn over the fill, under the face details.
function rimLit(d, base, rim, dx, dy) {
  const id = uid('rim');
  DEFS.push(`<clipPath id="${id}"><path d="${d}"/></clipPath>`);
  return `<g clip-path="url(#${id})"><path d="${d}" fill="${rim}"/><path d="${d}" fill="${base}" transform="translate(${dx},${dy})"/></g>`;
}

// ---------------------------------------------------------------------------------------------
// Baked glow. The still used feGaussianBlur on a few flat discs; an animated SVG must not carry
// filters, so each glow is a radial gradient whose alpha profile is the exact blur of a disc:
// I(r) = ∫0..R (ρ/σ²) e^(-(r-ρ)²/2σ²) i0e(rρ/σ²) dρ, with i0e(x) = e^-x I0(x).
function i0e(x) {
  if (x < 3.75) {
    const t = (x / 3.75) ** 2;
    return Math.exp(-x) * (1 + t * (3.5156229 + t * (3.0899424 + t * (1.2067492 + t * (0.2659732 + t * (0.0360768 + t * 0.0045813))))));
  }
  const t = 3.75 / x;
  return (0.39894228 + t * (0.01328592 + t * (0.00225319 + t * (-0.00157565 + t * (0.00916281 + t * (-0.02057706 + t * (0.02635537 + t * (-0.01647633 + t * 0.00392377)))))))) / Math.sqrt(x);
}
function blurDisc(r, R, s) {
  const n = 160; let sum = 0;
  for (let i = 0; i < n; i++) {
    const p = (i + 0.5) / n * R;
    sum += (p / (s * s)) * Math.exp(-((r - p) ** 2) / (2 * s * s)) * i0e(r * p / (s * s));
  }
  return Math.min(1, sum * R / n);
}
// A gradient (objectBoundingBox) for a blurred disc of radius R, sigma s, drawn on a circle of radius R+3s.
const _glowCache = {};
function glowGrad(R, s, color) {
  const key = `${R}_${s}_${color}`;
  if (_glowCache[key]) return _glowCache[key];
  const out = R + 3 * s, stops = [];
  for (let i = 0; i <= 20; i++) { const f = i / 20; stops.push([f, color, blurDisc(f * out, R, s).toFixed(4)]); }
  return (_glowCache[key] = radial(uid('glw'), stops));
}
// Blurred flat circle / ellipse (ellipse: the circle profile stretched; close enough for soft light).
function glowCircle(cx, cy, R, s, color, extra = '') {
  return `<circle cx="${cx}" cy="${cy}" r="${f1(R + 3 * s)}" fill="${glowGrad(R, s, color)}" ${extra}/>`;
}
// Blurred flat ellipse: the gradient's profile is the exact 2D blur sampled along the major axis,
// and its minor radius is fitted so the profile along the minor axis matches too (least squares).
const _ellCache = {};
function glowEllipse(cx, cy, rx, ry, s, color, extra = '') {
  const key = `${rx}_${ry}_${s}_${color}`;
  if (!_ellCache[key]) {
    const exact = (x0, y0) => {
      let sum = 0;
      for (let x = -rx; x <= rx; x += 1) for (let y = -ry; y <= ry; y += 1) {
        if ((x / rx) ** 2 + (y / ry) ** 2 <= 1) sum += Math.exp(-((x - x0) ** 2 + (y - y0) ** 2) / (2 * s * s));
      }
      return sum / (2 * Math.PI * s * s);
    };
    const RX = rx + 3 * s, prof = [];
    for (let i = 0; i <= 20; i++) prof.push(exact(i / 20 * RX, 0));
    const at = (f) => { if (f >= 1) return 0; const k = f * 20, i = Math.floor(k); return prof[i] + (prof[i + 1] - prof[i]) * (k - i); };
    const ys = [], ey = [];
    for (let y = 0; y <= ry + 3 * s; y += 3) { ys.push(y); ey.push(exact(0, y)); }
    let best = [RX, 1e9];
    for (let RY = ry; RY <= RX; RY += 0.5) {
      let e = 0; ys.forEach((y, i) => { e += (at(y / RY) - ey[i]) ** 2; });
      if (e < best[1]) best = [RY, e];
    }
    _ellCache[key] = { RX, RY: best[0], fill: radial(uid('gle'), prof.map((v, i) => [i / 20, color, v.toFixed(4)])) };
  }
  const g = _ellCache[key];
  return `<ellipse cx="${cx}" cy="${cy}" rx="${f1(g.RX)}" ry="${f1(g.RY)}" fill="${g.fill}" ${extra}/>`;
}

// ---------------------------------------------------------------------------------------------
// 2D affine matrices [a b c d e f] (SVG order). Every pose is a matrix built from a pivot.
const MX = {
  I: [1, 0, 0, 1, 0, 0],
  mul(A, B) {
    return [A[0] * B[0] + A[2] * B[1], A[1] * B[0] + A[3] * B[1], A[0] * B[2] + A[2] * B[3], A[1] * B[2] + A[3] * B[3],
      A[0] * B[4] + A[2] * B[5] + A[4], A[1] * B[4] + A[3] * B[5] + A[5]];
  },
  chain(...Ms) { return Ms.reduce((a, b) => MX.mul(a, b), MX.I); },
  T: (x, y) => [1, 0, 0, 1, x, y],
  R(deg) { const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return [c, s, -s, c, 0, 0]; },
  S: (sx, sy = sx) => [sx, 0, 0, sy, 0, 0],
  about(px, py, M) { return MX.chain(MX.T(px, py), M, MX.T(-px, -py)); },
  pt(M, p) { return [M[0] * p[0] + M[2] * p[1] + M[4], M[1] * p[0] + M[3] * p[1] + M[5]]; },
  inv(M) {
    const det = M[0] * M[3] - M[1] * M[2];
    const a = M[3] / det, b = -M[1] / det, c = -M[2] / det, d = M[0] / det;
    return [a, b, c, d, -(a * M[4] + c * M[5]), -(b * M[4] + d * M[5])];
  },
  str(M) { return `matrix(${M.map(v => Math.round(v * 1e6) / 1e6).join(' ')})`; },
};
// A pose about a pivot: translate (x,y), rotate r degrees, scale (sx,sy), all around (px,py).
function poseM(px, py, p = {}) {
  return MX.chain(MX.T(p.x || 0, p.y || 0), MX.about(px, py, MX.mul(MX.R(p.r || 0), MX.S(p.sx ?? 1, p.sy ?? 1))));
}

// Scene registry markup. A cel is one drawing of a part; only one cel of a part shows at a time
// (limited animation swaps drawings). A rig group carries a transform, an fx group an opacity.
const cel = (part, name, content, show = false) => `<g data-cel="${part}:${name}"${show ? '' : ' style="display:none"'}>${content}</g>`;
const rig = (id, content, extra = '') => `<g data-x="${id}" ${extra}>${content}</g>`;
const fxg = (id, content, extra = '') => `<g data-o="${id}" ${extra}>${content}</g>`;

// ---- room.js
// The room: black-heavy round chamber, ceiling ring with scallop lights, ribbed tubes,
// LED bars, porthole, monitor; a balcony rail with an angular crowd of small heads; the booth.
// The blast (flat ray burst in room colours) from the button.
//
// Prototype split: the drawing is the r11 still. The parts that move are wrapped in named groups
// (rig = transform, fxg = opacity, cel = swappable drawing); motion.js says what moves them. Every
// random draw keeps the still's order, so the hero frame is the still. New pieces (lasers, button
// glow, lamp dimmers, lens caps, extra scope traces, eye cels) draw nothing at the hero frame.
const BX = 470, BY = 588; // button centre
const LAMPS = [];          // x of each scallop lamp, left to right
const LEDS = [];           // [column][bar] -> true when lit in the still

function room() {
  _seed = 21;
  let s = `<rect x="-400" y="-400" width="2400" height="1700" fill="#14060f"/>`;

      `M${x + w * 0.62},${y} L${x + w},${y} L${x + w - 10},${y + h} L${x + w * 0.7},${y + h}Z`, '#1f081c',
      `M${x + 6},${y + 8} L${x + 14},${y + h - 8}`, '#5e2457');

    }
  });
  // porthole to space
  s += `<circle cx="760" cy="250" r="96" fill="#3a1440" stroke="${PLUM}" stroke-width="3"/>`;

  for (let i = 0; i < 40; i++) { const a = rnd() * 6.283, r = Math.sqrt(rnd()) * 72; s += `<circle cx="${760 + Math.cos(a) * r}" cy="${250 + Math.sin(a) * r}" r="${0.8 + rnd() * 1.6}" fill="#fff" opacity="${0.4 + rnd() * 0.6}"/>`; }
  s += `<circle cx="732" cy="232" r="22" fill="#4a7bff"/><path d="M712,236 a22,22 0 0 0 40,6 a26,26 0 0 1 -40,-6z" fill="#2440a8"/>`;
  s += line('M698,196 A80,80 0 0 1 760,172', 4, '#c25bb8');
  for (let i = 0; i < 10; i++) { const a = i / 10 * 6.283; s += `<circle cx="${760 + Math.cos(a) * 88}" cy="${250 + Math.sin(a) * 88}" r="4" fill="#7a2c70" stroke="${PLUM}" stroke-width="1.4"/>`; }
  // monitor with scanlines + waveform (left back); the trace flips between drawings on the beat
  s += zpanel('M120,250 L330,236 L338,392 L112,404Z', '#4a1640', 'M300,238 L330,236 L338,392 L306,394Z', '#33102d', 'M124,256 L320,244', '#a04a92', 2.6);
  s += `<path d="M138,266 L312,256 L318,378 L132,388Z" fill="#200a3a"/>`;
  for (let y = 262; y < 386; y += 6) s += `<line x1="132" y1="${y + (y - 262) * 0.05}" x2="318" y2="${y - 8 + (y - 262) * 0.05}" stroke="#3c1a66" stroke-width="2"/>`;
  s += cel('scope', 'hero', line('M142,330 L160,330 L168,300 L180,362 L192,284 L204,350 L216,318 L230,326 L240,296 L252,358 L264,316 L280,322 L308,318', 3.2, '#8cff3a'), true);
  for (let k = 0; k < 3; k++) {
    let d = 'M142,330 L160,330';

    s += cel('scope', 'k' + k, line(d + ' L308,322', 3.2, '#8cff3a'));
  }
  // ceiling ring: a huge curved band with scalloped lights hanging under it
  const ring = (x) => 30 + Math.pow((x - 820) / 900, 2) * 210;

  for (let x = -400; x <= 2000; x += 40) { top += (x === -400 ? 'M' : 'L') + x + ',' + f1(ring(x) - 70); }

  // dimmer over its dome are their own layers, so the chase can light one lamp at a time.
  let glow = '', dome = '';
  for (let x = -360; x < 2000; x += 96) {

    dome += `<path d="${cup}" fill="#3a0a30" data-o="lampDim${i}" opacity="0" style="display:none"/>`;
  }
  s += glow + dome;   // the still's 0.7 group opacity is folded into each glow (motion.js LAMP_GLOW)
  s += tube([[-60, 120], [40, 260], [20, 430], [120, 560]], 46, '#4e1a48', '#2a0b27', '#9a4b8c');
  s += tube([[1560, 140], [1500, 330], [1580, 470]], 40, '#4e1a48', '#2a0b27', '#9a4b8c');
  return s;
}

// A ribbed tube: base + shadow side + rim + rib rings.
function tube(pts, w, base, shade, rim) {
  let s = shape(tubeD(pts, pts.map(() => w), 40), base, 1.4, PLUM);
  const S = crSample(pts, 40);
  const sh = tubeD(pts.map((p) => [p[0] + w * 0.22, p[1]]), pts.map(() => w * 0.45), 40);
  s += `<path d="${sh}" fill="${shade}" opacity="0.9"/>`;
  for (let i = 1; i < S.length - 1; i += 3) {
    const a = S[i - 1], b = S[i + 1];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy); dx /= l; dy /= l;
    const p = S[i];
    s += line(`M${f1(p[0] - dy * w / 2)},${f1(p[1] + dx * w / 2)} Q${f1(p[0] + dx * 7)},${f1(p[1] + dy * 7)} ${f1(p[0] + dy * w / 2)},${f1(p[1] - dx * w / 2)}`, 2.4, PLUM);
  }
  s += line(crPath(pts.map(p => [p[0] - w * 0.28, p[1]])), 2.6, rim);
  return s;
}

// The back crowd: rows of small heads behind a curved balcony rail, angular mass.
// Each row is a rig (it bounces); each head carries three eye cels switched per row by class:
// e0 = the still's pinpoint squint, e1 = grooving (big pupils toward the DJ), e2 = wide-eyed.
const railY = (x) => 560 - (x - 600) * 0.03 + Math.pow((x - 1100) / 700, 2) * 20;
function backCrowd() {
  _seed = 5;
  let s = '';
  const cols = ['#ffc7b0', '#f2b3c8', '#c9e88a', '#ffd9a8', '#d9c2ff'];
  for (let row = 0; row < 3; row++) {
    let rs = '';
    for (let x = 600 + row * 22; x < 1700; x += 46 + rnd() * 10) {
      const y = railY(x) - 34 - row * 26 + rnd() * 6;
      const r = 17 - row * 2.5;
      const c = cols[Math.floor(rnd() * cols.length)];
      const lit = 0.55 + row * 0.12;
      let g = '';
      if (rnd() > 0.35) {
        const side = rnd() > 0.5 ? 1 : -1;
        g += `<path d="${tubeD([[x + side * r * 0.6, y + r * 0.6], [x + side * r * 1.3, y - r * 1.2]], [r * 0.45, r * 0.4], 8)}" fill="${c}" stroke="${INK}" stroke-width="3" paint-order="stroke"/>`;
        g += `<circle cx="${x + side * r * 1.35}" cy="${y - r * 1.35}" r="${r * 0.34}" fill="${c}" stroke="${INK}" stroke-width="2.6" paint-order="stroke"/>`;
      }
      const kind = rnd();
      let head;
      if (kind < 0.35) head = `M${x - r * 0.8},${y + r} L${x - r * 0.9},${y - r * 1.2} L${x - r * 0.3},${y - r * 1.5} L${x},${y - r * 1.25} L${x + r * 0.35},${y - r * 1.55} L${x + r * 0.9},${y - r * 1.2} L${x + r * 0.8},${y + r}Z`;
      else head = E(x, y, r * 1.1, r * 0.95);
      g += `<path d="${head}" fill="${c}" stroke="${INK}" stroke-width="3" paint-order="stroke" stroke-linejoin="round"/>`;
      const eye = (ex, rx, ry) => `<ellipse cx="${f1(ex)}" cy="${f1(y - r * 0.05)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="#fff" stroke="${INK}" stroke-width="1.6"/>`;
      let e0 = `<ellipse cx="${x - r * 0.38}" cy="${y - r * 0.05}" rx="${r * 0.33}" ry="${r * 0.42}" fill="#fff" stroke="${INK}" stroke-width="1.6"/>`;
      e0 += `<ellipse cx="${x + r * 0.38}" cy="${y - r * 0.05}" rx="${r * 0.33}" ry="${r * 0.42}" fill="#fff" stroke="${INK}" stroke-width="1.6"/>`;
      e0 += `<circle cx="${x - r * 0.42}" cy="${y}" r="${r * 0.08}" fill="${INK}"/><circle cx="${x + r * 0.34}" cy="${y}" r="${r * 0.08}" fill="${INK}"/>`;
      let e1 = eye(x - r * 0.38, r * 0.33, r * 0.42) + eye(x + r * 0.38, r * 0.33, r * 0.42);
      e1 += `<circle cx="${f1(x - r * 0.46)}" cy="${f1(y + r * 0.02)}" r="${f1(r * 0.21)}" fill="${INK}"/><circle cx="${f1(x + r * 0.3)}" cy="${f1(y + r * 0.02)}" r="${f1(r * 0.21)}" fill="${INK}"/>`;
      e1 += `<circle cx="${f1(x - r * 0.41)}" cy="${f1(y - r * 0.06)}" r="${f1(r * 0.08)}" fill="#fff"/><circle cx="${f1(x + r * 0.35)}" cy="${f1(y - r * 0.06)}" r="${f1(r * 0.08)}" fill="#fff"/>`;
      let e2 = eye(x - r * 0.42, r * 0.42, r * 0.54) + eye(x + r * 0.42, r * 0.42, r * 0.54);
      e2 += `<circle cx="${f1(x - r * 0.42)}" cy="${f1(y - r * 0.05)}" r="${f1(r * 0.07)}" fill="${INK}"/><circle cx="${f1(x + r * 0.42)}" cy="${f1(y - r * 0.05)}" r="${f1(r * 0.07)}" fill="${INK}"/>`;
      g += `<g class="e0">${e0}</g><g class="e1">${e1}</g><g class="e2">${e2}</g>`;
      g += `<ellipse cx="${x}" cy="${y + r * 0.55}" rx="${r * 0.12}" ry="${r * 0.16}" fill="${INK}"/>`;
      rs += `<g opacity="${lit}">${g}</g>`;
    }
    s += rig('crowd' + row, rs, 'class="ev0"');
  }
  s += `<rect x="560" y="420" width="1200" height="200" fill="#3a0a30" opacity="0.18"/>`;
  let rp = [];
  for (let x = 560; x <= 1720; x += 80) rp.push([x, railY(x)]);
  s += `<path d="M560,${railY(560)} ${rp.map(p => 'L' + f1(p[0]) + ',' + f1(p[1])).join('')} L1720,640 L560,640Z" fill="#2b0a24" stroke="${PLUM}" stroke-width="2"/>`;
  for (let x = 600; x < 1720; x += 110) s += `<rect x="${x}" y="${railY(x)}" width="10" height="70" fill="#4a1640" stroke="${PLUM}" stroke-width="1.6"/>`;
  s += `<path d="${tubeD(rp, rp.map(() => 22), 60)}" fill="#b03a8a" stroke="${PLUM}" stroke-width="2.6"/>`;
  s += line(crPath(rp.map(p => [p[0], p[1] - 5])), 4, '#ffc2e8');
  return s;
}

// The blast: hard-edged flat rays from the button, room colours, over the room.
function blast() {
  _seed = 99;
  let s = '';
  const rays = [];
  let a = -200;
  while (a < 25) {
    const w = 4 + rnd() * 8;
    rays.push([a, a + w]);
    a += w + 8 + rnd() * 12;
  }
  const L = 2400;
  let pinks = '', pales = '', greens = '';
  rays.forEach(([a0, a1], i) => {
    const r0 = a0 * Math.PI / 180, r1 = a1 * Math.PI / 180;
    const d = `M${BX},${BY} L${f1(BX + Math.cos(r0) * L)},${f1(BY + Math.sin(r0) * L)} L${f1(BX + Math.cos(r1) * L)},${f1(BY + Math.sin(r1) * L)}Z`;
    if (i % 5 === 3) greens += `<path d="${d}"/>`;
    else if (i % 2) pales += `<path d="${d}"/>`;
    else pinks += `<path d="${d}"/>`;
  });
  s += rig('rays', `<g fill="#ff2fa4" opacity="0.5" data-ray="0.5" style="mix-blend-mode:screen">${pinks}</g><g fill="#ffb3e3" opacity="0.36" data-ray="0.36" style="mix-blend-mode:screen">${pales}</g><g fill="#8cff3a" opacity="0.3" data-ray="0.3" style="mix-blend-mode:screen">${greens}</g>`);
  s += fxg('glowCore', glowCircle(BX, BY - 30, 260, 40, '#ff7fd0', 'opacity="0.55"'));
  const star = (R0, R1, n, rot) => {
    const p = [];
    for (let i = 0; i < n * 2; i++) {
      const aa = rot + i / (n * 2) * Math.PI * 2;
      const rr = i % 2 ? R0 * (0.8 + rnd() * 0.3) : R1 * (0.75 + rnd() * 0.45);
      p.push([BX + Math.cos(aa) * rr, BY - 30 + Math.sin(aa) * rr * 0.8]);
    }
    return poly(p);
  };
  s += rig('star', `<path d="${star(150, 330, 14, 0.1)}" fill="#ff8fd6"/><path d="${star(110, 230, 12, 0.3)}" fill="#ffe3f5"/><path d="${star(70, 150, 10, 0.05)}" fill="#ffffff"/>`);
  return s;
}

// ---- motion.js
// Motion: the whole picture as a pure function of the beat clock.
//
// frame(t) takes the cycle position and returns a plain description of the picture (rig matrices,
// opacities, which cel each part shows, the camera); app.js writes it to the SVG. Nothing here reads
// wall time, so a seek always gives the same picture, and the same function can drive a WebGL port.
//
// Time: c is the cycle position in beats, 0..32 (8 bars of 4/4). c = 0 is the drop. Bars 0-5 are the
// groove (bars 1-6 on the phrase strip), 24-32 the build. cq is c quantised to animation steps
// ("on twos": steps of 1/spb beat, ~12 fps, locked to the beat so a hit lands on its beat). The
// characters and props read cq; lights, lasers, rays and the camera read c and move at display rate.
const CYCLE = 32, BUILD = 24;
const HOLD = 0.5;          // the hero frame holds from the impact until here (beats)
const IMPACT = 0.07;       // two-colour impact frames before the hero frame (beats; ~2 display frames)
const stepsPerBeat = (bpm) => Math.max(4, Math.round(720 / bpm));

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (c, a, b) => clamp((c - a) / (b - a));
const smooth = (t) => t * t * (3 - 2 * t);
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeIn = (t) => t * t;
const back = (t, s = 1.70158) => { const u = t - 1; return 1 + (s + 1) * u * u * u + s * u * u; };
const elastic = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -9 * t) * Math.sin((t * 10 - 0.75) * 2 * Math.PI / 3) + 1);
const mod = (a, n) => ((a % n) + n) % n;
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const vnoise = (x) => { const i = Math.floor(x), f = smooth(x - i); return lerp(hash(i), hash(i + 1), f) * 2 - 1; };
const decay = (ph, k) => Math.exp(-ph * k);

// The groove's body curve: +1 squash on the beat, -1 stretch on the off-beat. Sampled on twos it
// snaps: hit, rebound past the stretch (overshoot), hold, fall into the next beat.
function bounce(ph) {
  if (ph < 0.08) return 1;
  if (ph < 0.5) return lerp(1, -1, back(seg(ph, 0.08, 0.5), 2.2));
  return lerp(-1, 1, easeIn(seg(ph, 0.5, 1)));
}
// Blast light: full at the drop, gone 5 beats later. Characters' pink rim lights follow it.
const blastI = (c) => (c < 1 ? 1 : 1 - smooth(seg(c, 1, 5)));

// --- the DJ -----------------------------------------------------------------------------------
const DJ_FEET = [455, 540], DJ_NECK = [420, 362], STAND_Y = 26;
function djPose(T) {
  const { cq, spb } = T, ph = mod(cq, 1), beat = Math.floor(cq);
  const P = { root: {}, head: {}, phones: 0, legs: 'stand', torso: 'pumpL', eyes: 'hero', slot: 'back' };
  if (cq < HOLD) return { ...P, legs: 'hero', torso: 'hero', slot: 'front' };
  if (cq < 2.25) {                       // bounces off the button and drops behind it, cackling
    const t = seg(cq, HOLD, 2.25);
    if (t < 0.3) { P.root = { y: -64 * easeOut(t / 0.3), r: -6 * t / 0.3 }; P.legs = 'hero'; P.torso = 'windup'; P.slot = 'front'; }
    else if (t < 0.7) { const u = (t - 0.3) / 0.4; P.root = { y: lerp(-64, STAND_Y, easeIn(u)), r: -6 * (1 - u) }; P.legs = u > 0.4 ? 'stand' : 'hero'; P.torso = 'pumpR'; }
    else { const u = 1 - seg(t, 0.7, 1); P.root = { y: STAND_Y + 6 * u, sy: 1 - 0.16 * u, sx: 1 + 0.12 * u }; P.torso = 'pumpL'; }
    P.head = { r: (Math.floor(cq * spb) % 2 ? 5 : -5) * (1 - t) };
    P.eyes = t > 0.75 ? 'blink' : 'hero';
    return P;
  }
  if (cq < BUILD) {                      // the groove
    const b = bounce(ph), bl = bounce(mod(ph - 1 / spb, 1));
    P.root = { y: STAND_Y + (b > 0 ? 5 * b : 12 * b), sy: 1 - 0.05 * b, sx: 1 + 0.04 * b };
    P.head = { sy: 1 - 0.08 * b, sx: 1 + 0.05 * b, r: (beat % 2 ? 4 : -4) * (ph < 0.08 ? 1.4 : 1) };
    P.phones = bl < 0 ? 14 * bl : 5 * bl;  // the headphones jump a step late
    P.torso = beat % 2 ? 'pumpR' : 'pumpL';
    if (Math.floor(cq / 4) % 2 && beat % 4 === 2 && ph > 0.3 && ph < 0.55) P.eyes = 'blink';
    return P;
  }
  // the build: crouch, leap, hover in a wind-up squash that tightens to the drop
  P.torso = 'windup';
  const pulse = cq < 28 ? decay(ph, 5) : decay(mod(cq * 2, 1), 5);
  if (cq < 26) {
    const u = easeOut(seg(cq, 24, 25));
    P.root = { y: STAND_Y + 14 * u, sy: 1 - 0.12 * u - 0.04 * pulse, sx: 1 + 0.08 * u };
    P.head = { sy: 1 - 0.06 * u, r: -3 * u };
  } else if (cq < 26.75) {
    const u = seg(cq, 26, 26.75), y = lerp(STAND_Y + 14, -50, back(u, 1.4));
    P.root = { y, sy: lerp(1.16, 1, u), sx: lerp(0.9, 1, u), r: -4 * u };
    P.legs = 'hero'; P.slot = y < 10 ? 'front' : 'back';
  } else {
    const u = seg(cq, 26.75, 31.5), w = seg(cq, 31.5, 32);
    const shake = cq >= 28 && !T.reduced ? (Math.floor(cq * spb) % 2 ? 1 : -1) * (1.5 + 3.5 * seg(cq, 28, 32)) : 0;
    P.root = { x: shake, y: -50 - 44 * u - 10 * w - 6 * pulse, sy: 0.92 - 0.04 * pulse - 0.1 * w, sx: 1.06 + 0.04 * pulse + 0.08 * w, r: -4 - 4 * w + shake * 0.5 };
    P.head = { r: -4 - 6 * w, sy: 1 - 0.05 * pulse };
    P.legs = 'hero'; P.slot = 'front';
  }
  return P;
}

// --- the button -------------------------------------------------------------------------------
function domePose(T) {
  const { cq } = T, ph = mod(cq, 1);
  if (cq < HOLD) return {};
  if (cq < 1.75) { const e = elastic(seg(cq, HOLD, 1.75)); return { sy: 1 + 0.15 * e, sx: 1 - 0.02 * e }; }
  if (cq < BUILD) { const k = Math.max(0, bounce(ph)); return { sy: 1.15 - 0.07 * k, sx: 0.98 + 0.04 * k }; }
  const p = cq < 28 ? decay(ph, 5) : decay(mod(cq * 2, 1), 5);
  return { sy: 1.15 + 0.08 * p, sx: 0.98 - 0.02 * p };
}

// --- the pompadour raver and his hairpiece -----------------------------------------------------
function guyPose(T) {
  const { cq, spb } = T, ph = mod(cq, 1), beat = Math.floor(cq);
  const P = { root: { r: 0 }, head: {}, legs: 'stand', torso: 'pumpA', eyes: 'normal', brows: 'calm', mouth: 'smile', bald: cq < 16 };
  const groove = (amt = 1) => {
    const b = bounce(ph);
    P.root = { r: 0, y: amt * (b > 0 ? 3 * b : 7 * b), sy: 1 - 0.03 * b * amt };
    P.head = { y: 5 * Math.max(b, 0) * amt, sy: 1 - 0.05 * b * amt, r: (beat % 2 ? 3 : -3) * amt };
    P.torso = beat % 2 ? 'pumpB' : 'pumpA';
  };
  if (cq < HOLD) return { ...P, root: { r: 22 }, legs: 'hero', torso: 'hero', eyes: 'hero', brows: 'hero', mouth: 'hero', bald: true };
  if (cq < 1) return { ...P, root: { r: 22 + 6 * seg(cq, HOLD, 1) }, legs: 'hero', torso: 'hero', eyes: 'hero', brows: 'hero', mouth: 'hero', bald: true };
  if (cq < 2.25) {
    const t = seg(cq, 1, 2.25);
    P.root = { r: 28 * (1 - back(t, 1.6)), sy: t > 0.45 && t < 0.7 ? 0.9 : 1 };
    Object.assign(P, { legs: t < 0.4 ? 'hero' : 'stand', torso: 'hero', eyes: 'hero', brows: 'hero', mouth: 'hero' });
    return P;
  }
  if (cq < 4) { P.head = { r: Math.sin(cq * 9) * 3 }; return Object.assign(P, { torso: 'hero', eyes: cq < 3 ? 'hero' : 'up', brows: 'hero', mouth: 'hero' }); }
  if (cq < 8) { groove(0.8); return Object.assign(P, { eyes: beat % 2 ? 'up' : 'normal', brows: 'calm', mouth: 'flat' }); }
  if (cq < 14) { groove(0.5); P.torso = 'crouch'; return Object.assign(P, { eyes: 'left', brows: 'sad', mouth: 'flat' }); }   // sulks, arms down, so the gag stays clear
  if (cq < 16) { P.head = { r: -4 * seg(cq, 14, 16) }; return Object.assign(P, { torso: 'hero', eyes: 'up', brows: 'hero', mouth: 'hero' }); }
  if (cq < 17) {
    const u = 1 - seg(cq, 16, 16.5);
    P.root = { r: 0, sy: 1 - 0.1 * u, sx: 1 + 0.06 * u };
    return Object.assign(P, { torso: 'pumpB', eyes: cq < 16.4 ? 'blink' : 'normal', brows: 'calm', mouth: 'smile' });

  const p = cq < 28 ? decay(ph, 5) : decay(mod(cq * 2, 1), 5), u = seg(cq, 24, 25);
  P.root = { r: 0, y: 10 * u + 3 * p, sy: 1 - 0.07 * u - 0.03 * p, sx: 1 + 0.04 * u };
  P.head = { r: Math.sin(cq * spb * 2.1) * 1.5 * seg(cq, 28, 32) };

}

function guyMatrices(P) {

// --- the flag kid -----------------------------------------------------------------------------

// --- the round raver and her glowstick ----------------------------------------------------------

// World matrix for the glowstick held in her mitten (inside her rig, scaled back to world size).
function stickHeld(raverRoot, torso) {

const SHOTS = {

  dj: { c: [356, 372], w: 860, zoom: 0.07, move: [12, 6] },
  djUp: { c: [440, 400], w: 1040, zoom: 0.12, move: [0, -20] },
  button: { c: [476, 586], w: 680, zoom: 0.08, move: [-8, 4] },
  raver: { c: [1270, 700], w: 720, zoom: 0.07, move: [-10, -6] },
  pomp: { c: [1080, 360], w: 800, zoom: 0.06, move: [14, -4] },

// --- the frame ----------------------------------------------------------------------------------

  F.o.debrisLine = cq < HOLD ? 1 : 0;
  F.o.pompFx = cq < HOLD ? 1 : 0;

    const e = ctx.createGain(); e.gain.setValueAtTime(0.0001, t);
    for (const k of [0, 0.011, 0.022]) { e.gain.setValueAtTime(0.42, t + k); e.gain.exponentialRampToValueAtTime(0.05, t + k + 0.009); }

  }

  function snare(t, v) {
    const n = src(t, 0.16), f = filt('bandpass', 1900, 0.5); n.connect(f); f.connect(g(t, 0.75 * v, 0.001, 0.11, drums));
    const o = osc('triangle', 185 + 60 * v, t, 0.1); o.connect(g(t, 0.4 * v, 0.001, 0.07, drums));

  function bass(t, f, dur, cut) {
    const o = osc('sawtooth', f, t, dur + 0.05), o2 = osc('square', f / 2, t, dur + 0.05);
    const lp = filt('lowpass', cut * 3.2, 7); lp.frequency.setValueAtTime(cut * 3.2, t); lp.frequency.exponentialRampToValueAtTime(cut, t + dur * 0.9);
    o.connect(lp); const sub = ctx.createGain(); sub.gain.value = 0.5; o2.connect(sub); sub.connect(lp);

  function stab(t, fs) {
    const lp = filt('lowpass', 2200, 1.2); lp.connect(g(t, 0.055, 0.003, 0.17, music));
    for (const f of fs) for (const det of [-7, 7]) { const o = osc('sawtooth', f, t, 0.25); o.detune.value = det; o.connect(lp); }
  }
  function riser(t, dur, prog) {
    const n = src(t, dur * 1.3), f = filt('bandpass', 350 * Math.pow(2, prog * 4.6), 4); n.connect(f);
    const e = ctx.createGain(), lv = 0.06 + 0.85 * prog * prog;
    e.gain.setValueAtTime(0.0001, t); e.gain.linearRampToValueAtTime(lv, t + dur * 0.3); e.gain.linearRampToValueAtTime(0.0001, t + dur * 1.25);

  }
  function crash(t) {
    const n = src(t, 2.6), f = filt('highpass', 4800); n.connect(f); f.connect(g(t, 0.3, 0.002, 2.3, drums));
    const n2 = src(t, 1.2), f2 = filt('bandpass', 8200, 2); n2.connect(f2); f2.connect(g(t, 0.12, 0.002, 1, drums));
  }
  function drop(t) {
    kick(t, 1.25);
    const o = osc('sine', 62, t, 1.8); o.frequency.exponentialRampToValueAtTime(33, t + 1.4); o.connect(g(t, 0.75, 0.004, 1.6, drums));
    const n = src(t, 0.3), f = filt('lowpass', 900, 1); n.connect(f); f.connect(g(t, 0.5, 0.001, 0.22, drums));   // the slam
    crash(t);

  }
  // cartoon effects for the gags
  function whistle(t, f0, f1, dur, vib = 7) {
    const o = osc('sine', f0, t, dur + 0.05); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const l = osc('sine', vib, t, dur + 0.05), ld = ctx.createGain(); ld.gain.value = f0 * 0.02; l.connect(ld); ld.connect(o.frequency);
    const e = ctx.createGain(); e.gain.setValueAtTime(0.0001, t); e.gain.linearRampToValueAtTime(0.05, t + 0.04);

  function boing(t, f) {
    const o = osc('sine', f, t, 0.55), curve = new Float32Array(64);

  const ROOT = [55, 55, 43.65, 49, 55, 65.41];
  const CHORD = [[220, 261.6, 329.6], [220, 261.6, 329.6], [174.6, 220, 261.6], [196, 246.9, 293.7], [220, 261.6, 329.6], [261.6, 329.6, 392]];
  function play(s, t, bpm) {
    const b = 60 / bpm, s16 = b / 4, bar = Math.floor(s / 16), st = s % 16, sub = st % 4;

      const p = st / 16;

      if (sub === 0) kick(t, 0.35 * (1 - p));          // a ghost of the kick, fading out of the bar
      if (sub === 2) hat(t, 0.8);

      const p = st / 16;
      if (st < 15) { snare(t, 0.65 + 0.55 * p); riser(t, s16, 0.5 + 0.5 * p); }
    }
    // the gags
    if (s === 2) whistle(t, 520, 1900, b * 1.8);          // the pompadour flies off
    if (s === 24) tink(t);                                // the glowstick is caught
    if (s === 22) whistle(t, 1700, 380, b * 2.5);         // ...and the pompadour comes back down
    if (s === 32) boing(t, 150);                          // landing on the kid
    if (s === 58) whistle(t, 600, 1300, b * 0.75, 0);     // the hop home
    if (s === 61) whistle(t, 1300, 500, b * 0.75, 0);
    if (s === 64) boing(t, 210);
  }
  return { ctx, master, play };
}

// ---- app.js
// The controller: the clock, the scheduler, the controls, and writing frame() into the SVG.
//
// The clock counts beats. With sound on, AudioContext time is the master: the picture shows the
// beat that is reaching the speakers now (output timestamp, or currentTime minus outputLatency).
// With sound off it runs on performance.now(). Tempo changes, pauses and clock switches re-anchor
// (anchorPos at anchorTime), so the beat position never jumps.
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* private mode */ } } };
  const S = {
    bpm: clamp(+store.get('toonRave.bpm') || 128, 90, 160), level: 1, playing: !reduced, sound: false, started: false,
    anchorPos: reduced ? 0.3 : -16, anchorTime: performance.now() / 1000, dropAnchor: 0, pending: null, synth: null, shot: null,
  };

  // --- build the SVG -------------------------------------------------------------------------
  const world = [room(), backCrowd(), floor(), lasers(), blast(), flagRaver(), booth(), '<g id="djBack"></g>', buttonGlow(), button(), slamFx(), debris(),
    `<g id="djFront">${dj()}</g>`, pompadour(), '<g id="stickBack"></g>', roundRaver(), `<g id="stickFront">${glowstick()}</g>`].join('');
  // impact frames: the hero frame thresholded to two colours (and then inverted)
  const two = (id, lo, hi) => `<filter id="${id}" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.3 0.59 0.11 0 0 0.3 0.59 0.11 0 0 0.3 0.59 0.11 0 0 0 0 0 0 1"/><feComponentTransfer><feFuncR type="discrete" tableValues="${lo[0]} ${hi[0]} ${hi[0]}"/><feFuncG type="discrete" tableValues="${lo[1]} ${hi[1]} ${hi[1]}"/><feFuncB type="discrete" tableValues="${lo[2]} ${hi[2]} ${hi[2]}"/></feComponentTransfer></filter>`;
  DEFS.push(two('impactA', [0.06, 0.01, 0.05], [1, 0.18, 0.64]), two('impactB', [1, 0.93, 0.97], [0.06, 0.01, 0.05]));
  const stage = document.getElementById('stage');
  stage.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><defs>${DEFS.join('')}</defs><rect width="1600" height="900" fill="#14060f"/><g id="cam"><g transform="rotate(-7,800,450) translate(800,450) scale(1.1) translate(-800,-450)">${world}</g></g></svg>`;
  const svg = stage.firstChild, $ = (id) => document.getElementById(id);
  const REG = { x: {}, o: {}, cel: {}, led: [] };
  svg.querySelectorAll('[data-x]').forEach(el => { REG.x[el.dataset.x] = el; });
  svg.querySelectorAll('[data-o]').forEach(el => { (REG.o[el.dataset.o] ||= []).push(el); });
  svg.querySelectorAll('[data-cel]').forEach(el => { const [p, n] = el.dataset.cel.split(':'); (REG.cel[p] ||= {})[n] = el; });
  const rayEls = [...svg.querySelectorAll('[data-ray]')];
  svg.querySelectorAll('[data-led]').forEach(el => { const [j, i] = el.dataset.led.split(':').map(Number); (REG.led[j] ||= [])[i] = el; });
  const slots = { dj: { front: $('djFront'), back: $('djBack'), el: REG.x.dj, at: 'front' }, stick: { front: $('stickFront'), back: $('stickBack'), el: REG.x.stick, at: 'front' } };
  const cam = $('cam');
  // the still's own transforms on rigs that need to keep them in their markup
  const cache = new Map();
  const showCel = {};
  for (const p in REG.cel) for (const n in REG.cel[p]) if (REG.cel[p][n].style.display !== 'none') showCel[p] = n;

  function setAttr(el, k, v) { const key = el; let m = cache.get(key); if (!m) cache.set(key, m = {}); if (m[k] !== v) { m[k] = v; if (v === null) el.removeAttribute(k); else el.setAttribute(k, v); } }

    let m = cache.get(el); if (!m) cache.set(el, m = {});
    const show = op > 0.003, o = show ? (op >= 0.999 ? '' : op.toFixed(3)) : m.o;
    if (m.show !== show) { m.show = show; el.style.display = show ? '' : 'none'; }
    if (show && !displayOnly && m.o !== o) { m.o = o; el.style.opacity = o; }
  }
  function apply(F) {
    for (const id in F.x) { const el = REG.x[id]; if (el) setAttr(el, 'transform', MX.str(F.x[id])); }
    for (const id in F.o) { const els = REG.o[id] || (REG.x[id] ? [REG.x[id]] : null); if (els) for (const el of els) setVis(el, F.o[id]); }
    for (const p in F.cel) {
      const want = F.cel[p], cur = showCel[p];
      if (want !== cur && REG.cel[p] && REG.cel[p][want]) { if (cur) REG.cel[p][cur].style.display = 'none'; REG.cel[p][want].style.display = ''; showCel[p] = want; }
    }
    for (const id in F.cls) setAttr(REG.x[id], 'class', F.cls[id]);
    for (const k in F.slot) { const s = slots[k]; if (s.at !== F.slot[k]) { s.at = F.slot[k]; s[s.at].appendChild(s.el); } }
    // the rays' screen blend must stay on the scene, so their opacity goes on the blend groups themselves
    setVis(REG.x.rays, F.rayOp, true);
    for (const el of rayEls) setAttr(el, 'opacity', (+el.dataset.ray * F.rayOp).toFixed(3));
    F.led.forEach((col, j) => col.forEach((on, i) => setVis(REG.led[j][i], on ? 1 : 0)));

  }

  style.textContent = '.ev0 .e1,.ev0 .e2,.ev1 .e0,.ev1 .e2,.ev2 .e0,.ev2 .e1{display:none}';
  document.head.appendChild(style);

  // --- the clock --------------------------------------------------------------------------------
  function audibleNow() {
    const ctx = S.synth.ctx;
    if (ctx.getOutputTimestamp) {
      const ts = ctx.getOutputTimestamp();
      if (ts.contextTime > 0 && ts.performanceTime > 0) {
        const t = ts.contextTime + (performance.now() - ts.performanceTime) / 1000;
        if (Math.abs(t - ctx.currentTime) < 0.5) return t;

  const now = () => (audioClock() ? audibleNow() : performance.now() / 1000);
  const pos = () => (S.playing ? S.anchorPos + (now() - S.anchorTime) * S.bpm / 60 : S.anchorPos);
  function reanchor(change) { const p = pos(); if (change) change(); S.anchorPos = p; S.anchorTime = now(); }

  function phrase(p) {
    let a = S.dropAnchor;

    const rel = p - a, k = Math.floor(rel / CYCLE);

  }

    if (!S.playing || !audioClock()) { nextSlot = null; return; }
    const ctx = S.synth.ctx, horizon = ctx.currentTime + 0.14;
    const timeOf = (p) => S.anchorTime + (p - S.anchorPos) * 60 / S.bpm;
    if (nextSlot === null) nextSlot = Math.ceil(pos() * 4 - 1e-6);
    for (let n = 0; n < 64; n++) {
      const p = nextSlot / 4, t = timeOf(p);
      if (t > horizon) break;

        const { c } = phrase(p), slot = Math.round(c * 4) % 128;

  // --- rendering --------------------------------------------------------------------------------
  let lastP = null, frames = 0;
  const perf = { n: 0, sum: 0 };

    const p = pos();
    if (S.pending !== null && p >= S.pending) { S.dropAnchor = S.pending; S.pending = null; }
    if (!force && p === lastP) return;
    lastP = p;
    const t0 = performance.now();
    const spb = stepsPerBeat(S.bpm), pq = Math.floor(p * spb + 1e-6) / spb;
    const A = phrase(p), Q = phrase(pq);
    const F = frame({ c: A.c, k: A.k, cq: Q.c, kq: Q.k, bpm: S.bpm, spb, level: S.level, reduced, shot: S.shot });
    apply(F);
    strip(A.c);
    S.last = { pos: p, c: A.c, k: A.k, cq: Q.c, shot: F.shot, filter: F.filter };
    perf.sum += performance.now() - t0; perf.n++;
    frames++;
  }
  function loop() { render(false); requestAnimationFrame(loop); }

  // --- the controls -----------------------------------------------------------------------------
  const cells = $('cells'), dots = $('dots');
  const cellEls = [], dotEls = [];
  for (let i = 0; i < 8; i++) { const d = document.createElement('div'); d.className = 'cell' + (i >= 6 ? ' build' : ''); d.textContent = i + 1; cells.appendChild(d); cellEls.push(d); }
  for (let i = 0; i < 4; i++) { const d = document.createElement('div'); d.className = 'dot'; dots.appendChild(d); dotEls.push(d); }
  let lastBar = -1, lastBeat = -1;
  function strip(c) {
    const bar = Math.floor(c / 4), beat = Math.floor(c) % 4;
    if (bar !== lastBar) { if (lastBar >= 0) cellEls[lastBar].classList.remove('on'); cellEls[bar].classList.add('on'); lastBar = bar; }
    if (beat !== lastBeat) { if (lastBeat >= 0) dotEls[lastBeat].classList.remove('on'); dotEls[beat].classList.add('on'); lastBeat = beat; }
  }
  const playBtn = $('play'), soundBtn = $('sound'), tempo = $('tempo'), tempoOut = $('tempoOut'), cuts = $('cuts'), live = $('live');
  function syncUi() {
    playBtn.textContent = !S.started ? 'Play with sound' : (S.playing ? 'Pause' : 'Play');
    soundBtn.textContent = S.sound ? 'Sound on' : 'Sound off';
    soundBtn.setAttribute('aria-pressed', String(S.sound));
    tempo.value = S.bpm; tempoOut.textContent = `${S.bpm} BPM`;
  }
  function ensureSynth() {
    if (!S.synth) { try { S.synth = createSynth(); } catch (e) { S.synth = null; } }
    return S.synth;
  }
  async function setSound(on) {
    if (on && !ensureSynth()) return;
    if (on) {
      const p = pos();
      S.synth.master.gain.setTargetAtTime(0.5, S.synth.ctx.currentTime, 0.01);
      try { await S.synth.ctx.resume(); } catch (e) { /* stays silent */ }
      S.sound = S.synth.ctx.state === 'running';
      S.anchorPos = p; S.anchorTime = now(); nextSlot = null;
    } else {
      reanchor(() => { S.sound = false; });
      if (S.synth) { const ctx = S.synth.ctx; S.synth.master.gain.setTargetAtTime(0, ctx.currentTime, 0.02); setTimeout(() => { if (!S.sound) ctx.suspend(); }, 150); }
    }

  function setPlaying(on) {
    reanchor(() => { S.playing = on; });
    if (S.playing) S.anchorTime = now();
    nextSlot = null; syncUi();
  }
  function togglePlay() {
    if (!S.started) { S.started = true; ensureSynth(); if (!S.playing) setPlaying(true); setSound(true); syncUi(); return; }
    setPlaying(!S.playing);
  }
  function dropNow() {
    const p = pos(), { c } = phrase(p);
    if (S.pending !== null) return;
    if (c >= 30) return;                       // the drop is less than half a bar away anyway
    let bd = Math.ceil(p / 4 - 1e-9) * 4;
    if (bd - p < 1) bd += 4;                   // leave at least a beat of build
    S.pending = bd;
    live.textContent = 'Drop on the next bar';
  }
  playBtn.addEventListener('click', togglePlay);
  soundBtn.addEventListener('click', () => { S.started = true; setSound(!S.sound); });
  $('drop').addEventListener('click', dropNow);
  tempo.addEventListener('input', () => { reanchor(() => { S.bpm = +tempo.value; }); nextSlot = null; store.set('toonRave.bpm', S.bpm); syncUi(); });
  cuts.addEventListener('input', () => { S.level = +cuts.value; });
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) togglePlay(); }
    else if (e.key === 'd' || e.key === 'D') dropNow();

  document.addEventListener('keyup', (e) => { if (e.code === 'Space') e.preventDefault(); });

  const bar = $('bar');

    seek(seconds) { S.playing = false; S.anchorPos = seconds * S.bpm / 60; S.pending = null; S.dropAnchor = 0; render(true); syncUi(); return S.last; },
    seekBeat(b) { S.playing = false; S.anchorPos = b; S.pending = null; S.dropAnchor = 0; render(true); syncUi(); return S.last; },
    render() { render(true); return S.last; },
    state() { return { ...S.last, bpm: S.bpm, playing: S.playing, sound: S.sound, level: S.level, bar: Math.floor(S.last.c / 4) + 1, beat: Math.floor(S.last.c) % 4 + 1, frames, scriptMs: perf.n ? perf.sum / perf.n : 0 }; },
    set(o) { if ('level' in o) { S.level = o.level; cuts.value = o.level; } if ('shot' in o) S.shot = o.shot; if ('bpm' in o) reanchor(() => { S.bpm = o.bpm; }); if ('play' in o) setPlaying(o.play); render(true); return S.last; },
    // offline render of the soundtrack for a preview video: WAV (base64) from cycle beat b0 for n beats
    async renderAudio(b0, n) {
      const sr = 44100, dur = n * 60 / S.bpm, oc = new OfflineAudioContext(2, Math.ceil(sr * (dur + 0.5)), sr), syn = createSynth(oc);
      for (let s = Math.ceil(b0 * 4); s < (b0 + n) * 4; s++) syn.play(mod(s, 128), (s / 4 - b0) * 60 / S.bpm, S.bpm);

      v.setUint32(24, sr, true); v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, len * 4, true);

    resetPerf() { perf.n = 0; perf.sum = 0; frames = 0; },
  };
  syncUi();
  render(true);
  requestAnimationFrame(loop);
})();

</script>
