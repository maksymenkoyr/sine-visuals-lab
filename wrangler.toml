name = "audio-viz-room"
main = "server/worker.ts"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Serve the built site (index.html + tv.html + bundles) from the same Worker
# as the API, so the client can use location.origin in prod (src/net/config.ts).
# Paths that don't match a file in dist/ (i.e. /api/*) fall through to fetch().
[assets]
directory = "./dist"
