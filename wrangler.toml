name = "audio-viz-room"
main = "server/worker.ts"
compatibility_date = "2026-08-01"

# Explicit: adding [[routes]] below silently disabled the workers.dev subdomain
# on deploy (confirmed via the account API), despite wrangler's docs claiming
# workers_dev defaults to true regardless of routes. Kept on as a free fallback
# while sinevisualslab.com's cert/DNS were provisioning, and for checking a
# deploy before it's live on the real domain.
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Serve the built site (index.html + tv.html + bundles) from the same Worker
# as the API, so the client can use location.origin in prod (src/net/config.ts).
# Paths that don't match a file in dist/ (i.e. /api/*) fall through to fetch().
[assets]
directory = "./dist"

# Custom Domains, not route patterns: this Worker serves the site as well as the
# API, so every path on these hostnames must reach it. Cloudflare creates the
# proxied DNS record and the certificate from these entries.
#
# These live here rather than in the dashboard on purpose: `wrangler deploy`
# overrides dashboard-configured routes whenever config omits them, and every
# push to main deploys (.github/workflows/deploy.yml).
[[routes]]
pattern = "sinevisualslab.com"
custom_domain = true

[[routes]]
pattern = "www.sinevisualslab.com"
custom_domain = true

# ---------------------------------------------------------------------------
# Per-PR preview Workers — `wrangler deploy --env preview --name <pr-name>`,
# run by .github/workflows/deploy.yml on every push to an open pull request and
# torn down (`wrangler delete`) when the PR closes. Each one is a fully separate
# Worker on the workers.dev subdomain, with its own Room namespace, so pairing
# works inside a preview but never crosses into prod.
#
# Environments inherit `main`, `compatibility_date`, `workers_dev`, `[assets]`
# and `[[migrations]]` from the top level, so the preview is built from exactly
# the same dist/ and Room class as prod. Two things must be spelled out:
#
#  - `routes = []`: `routes` is inherited too, and deploying an environment that
#    inherits a custom domain reassigns that domain away from the top-level
#    Worker — a preview would take sinevisualslab.com off prod. Wrangler warns
#    about exactly this at deploy time if the override is missing.
#  - `durable_objects`: bindings are *not* inherited (per-environment resources
#    are always explicit), so the ROOM binding is repeated here verbatim.
[env.preview]
routes = []

[[env.preview.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"
