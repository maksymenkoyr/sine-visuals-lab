name = "audio-viz-room"
main = "server/worker.ts"
compatibility_date = "2026-08-01"

# Explicit: adding [[routes]] below silently disabled the workers.dev subdomain
# on deploy (confirmed via the account API), despite wrangler's docs claiming
# workers_dev defaults to true regardless of routes. Kept on as a free fallback
# while sinevisualslab.com's cert/DNS were provisioning, and for checking a
# deploy before it's live on the real domain.
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Usage counts (server/usage.ts). Prod only: bindings aren't inherited by
# [env.preview], and that's deliberate — a preview's traffic is the owner's
# and reviewers', not visitors'. The dataset is created on first write.
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "sinevisualslab_usage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Serve the built site (index.html + tv.html + bundles) from the same Worker
# as the API, so the client can use location.origin in prod (src/net/config.ts).
# Paths that don't match a file in dist/ (i.e. /api/*) fall through to fetch().
[assets]
directory = "./dist"
binding = "ASSETS"
# Only the homepage runs the Worker first, so it can 301 the bare domain to
# www, and Insiders' old insider. hosts to insiders. (server/worker.ts);
# everything else is still served straight from dist/.
run_worker_first = ["/"]

# Custom Domains, not route patterns: this Worker serves the site as well as the
# API, so every path on these hostnames must reach it. Cloudflare creates the
# proxied DNS record and the certificate from these entries.
#
# These live here rather than in the dashboard on purpose: `wrangler deploy`
# overrides dashboard-configured routes whenever config omits them. This is
# the **Stable** release channel (src/version.ts owns what that means): the
# top-level Worker deploys only from `.github/workflows/release.yml`, on a
# merge into the `production` branch, never from a push to main — that's `[env.insider]`
# below.
[[routes]]
pattern = "sinevisualslab.com"
custom_domain = true

[[routes]]
pattern = "www.sinevisualslab.com"
custom_domain = true

# ---------------------------------------------------------------------------
# The **Insiders** channel — `wrangler deploy --env insider`, run by
# .github/workflows/deploy.yml on every push to main. Worker name is
# wrangler's own `<name>-<env>` default (`audio-viz-room-insider`, unset here on
# purpose, same as [env.preview] below never setting one); the Worker serves
# insiders.sinevisualslab.com, always built from whatever just landed on main, so
# there's a place to see (and pair a phone/TV against) the tip of main without
# waiting for a release.
#
# The env keeps its original singular name: renaming it would deploy a second
# Worker (`<name>-<env>`) with a fresh Room namespace, and that Worker couldn't
# claim these domains while the old one still held them. Only the names people
# see say "Insiders".
#
# Same two things [env.preview] has to spell out, for the same reasons — see
# that section's comment for `durable_objects`; `routes` here is this
# environment's *own* domain rather than an override, since (unlike preview)
# Insiders does want a stable custom domain of its own. It answers on www. too,
# as Stable does, for anyone who types the www habitually — a custom domain gets
# its own certificate, which the zone's Universal SSL (one level deep) wouldn't.
# The channel's first domains, insider. and www.insider., stay attached so links
# already shared keep working: their homepage 301s to insiders. (server/worker.ts),
# and every other path is served as before, so a tab already open there never
# loses its files.
[env.insider]
routes = [
  { pattern = "insiders.sinevisualslab.com", custom_domain = true },
  { pattern = "www.insiders.sinevisualslab.com", custom_domain = true },
  { pattern = "insider.sinevisualslab.com", custom_domain = true },
  { pattern = "www.insider.sinevisualslab.com", custom_domain = true },
]
# Insiders traffic is the owner's own testing, like a preview's — not visitors'.
analytics_engine_datasets = []

[[env.insider.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# ---------------------------------------------------------------------------
# Per-PR preview Workers — `wrangler deploy --env preview --name <pr-name>`,
# run by .github/workflows/deploy.yml on every push to an open pull request and
# torn down (`wrangler delete`) when the PR closes. Each one is a fully separate
# Worker on the workers.dev subdomain, with its own Room namespace, so pairing
# works inside a preview but never crosses into prod.
#
# Environments inherit `main`, `compatibility_date`, `workers_dev`, `[assets]`
# and `[[migrations]]` from the top level, so the preview is built from exactly
# the same dist/ and Room class as prod. Two things must be spelled out:
#
#  - `routes = []`: `routes` is inherited too, and deploying an environment that
#    inherits a custom domain reassigns that domain away from the top-level
#    Worker — a preview would take sinevisualslab.com off prod. Wrangler warns
#    about exactly this at deploy time if the override is missing.
#  - `durable_objects`: bindings are *not* inherited (per-environment resources
#    are always explicit), so the ROOM binding is repeated here verbatim.
[env.preview]
routes = []
# No usage counts from previews (see the dataset's comment above); spelled
# out so wrangler doesn't warn that the binding wasn't inherited.
analytics_engine_datasets = []

[[env.preview.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"
