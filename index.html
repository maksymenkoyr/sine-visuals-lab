<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <!-- The snippet Google shows is this description — without it the crawler
     * stitched one together from the button labels ("GALLERY STOP MIC …").
     * Same string feeds og/twitter below and the JSON-LD graph. -->
    <meta
      name="description"
      content="Real-time WebGL music visualizer in your browser: microphone or screen audio drives reactive visuals, and your phone pairs with a TV. Free, no install."
    />
    <!-- Both sinevisualslab.com and www. serve this page (two custom_domain
     * routes in wrangler.toml); www is the one Google indexes, so www is
     * canonical and the one every absolute URL below and in sitemap.xml uses. -->
    <link rel="canonical" href="https://www.sinevisualslab.com/" />
    <!-- Real files under public/ — Google's favicon rules accept neither the
     * data: URI this used to be nor SVG, only raster URLs (see tools/make-icons.mjs). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sine Visuals Lab" />
    <meta property="og:title" content="Sine Visuals Lab" />
    <meta
      property="og:description"
      content="Real-time WebGL music visualizer in your browser: microphone or screen audio drives reactive visuals, and your phone pairs with a TV. Free, no install."
    />
    <meta property="og:url" content="https://www.sinevisualslab.com/" />
    <meta property="og:image" content="https://www.sinevisualslab.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A caustics visual from Sine Visuals Lab: teal and violet ridges rippling over black." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sine Visuals Lab" />
    <meta
      name="twitter:description"
      content="Real-time WebGL music visualizer in your browser: microphone or screen audio drives reactive visuals, and your phone pairs with a TV. Free, no install."
    />
    <meta name="twitter:image" content="https://www.sinevisualslab.com/og.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Sine Visuals Lab",
            "url": "https://www.sinevisualslab.com/",
            "inLanguage": "en",
            "description": "Real-time WebGL music visualizer in your browser: microphone or screen audio drives reactive visuals, and your phone pairs with a TV. Free, no install."
          },
          {
            "@type": "WebApplication",
            "name": "Sine Visuals Lab",
            "url": "https://www.sinevisualslab.com/",
            "applicationCategory": "MultimediaApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires WebGL2",
            "description": "Real-time WebGL music visualizer in your browser: microphone or screen audio drives reactive visuals, and your phone pairs with a TV. Free, no install.",
            "image": "https://www.sinevisualslab.com/icon-512.png",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "sameAs": ["https://github.com/maksymenkoyr/sine-visuals-lab"]
          }
        ]
      }
    </script>
    <title>Sine Visuals Lab</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #gl {
        display: none;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        color: #fff9;
        font: 500 12px/1.4 ui-monospace, monospace;
        z-index: 5;
        pointer-events: none;
        white-space: pre;
        transition: opacity 0.4s;
      }
      #roomCode {
        position: fixed;
        top: 12px;
        right: 12px;
        color: #fffc;
        font: 600 13px/1.4 ui-monospace, monospace;
        letter-spacing: 0.05em;
        z-index: 5;
        background: #0008;
        padding: 4px 10px;
        border-radius: 999px;
        display: none;
        cursor: pointer;
      }
      /* Round glass chrome, same language as the controls panel
       * (src/ui/controlsTheme.ts — which also owns the "active" ring rule,
       * keyed off aria-pressed). */
      .iconBtn {
        position: fixed;
        width: 36px;
        height: 36px;
        border-radius: 999px;
        background: rgba(8, 11, 10, 0.3);
        -webkit-backdrop-filter: blur(18px) saturate(0.6) brightness(0.5);
        backdrop-filter: blur(18px) saturate(0.6) brightness(0.5);
        color: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.16);
        font: 400 13px/34px "Share Tech Mono", ui-monospace, monospace;
        text-align: center;
        z-index: 5;
        cursor: pointer;
        display: none;
        padding: 0;
        transition: opacity 0.4s, border-color 0.15s, color 0.15s;
      }
      #menuBtn {
        bottom: 16px;
        right: 16px;
      }
      #fsBtn {
        bottom: 16px;
        right: 58px; /* one button and a 6px gap in from #menuBtn */
      }
      /* Top-left of a scene: a plain "back to gallery" chip and a stop — no
       * branding, the visual stays the hero. The room panel's button, shown
       * only while a room exists, rides along at the end. Squared, unlike the round
       * buttons, and laid out by this flex row rather than fixed offsets
       * because the chip's width is its label's. */
      #sceneNav {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 5;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #sceneNav .iconBtn {
        position: static;
        border-radius: 3px;
        -webkit-backdrop-filter: blur(18px) saturate(0.6) brightness(0.5) contrast(1.08);
        backdrop-filter: blur(18px) saturate(0.6) brightness(0.5) contrast(1.08);
      }
      #sceneNav .iconBtn:hover {
        border-color: rgba(255, 255, 255, 0.4);
      }
      /* Every button in this row says what it does in words — a bare square
       * or grid glyph read as nothing in particular. */
      #sceneNav .iconBtn {
        width: auto;
        padding: 0 12px 0 10px;
        font-size: 11px;
        letter-spacing: 0.14em;
        color: rgba(255, 255, 255, 0.8);
        white-space: nowrap;
      }
      #stopBtn::before {
        content: "";
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 8px;
        vertical-align: middle;
        position: relative;
        top: -1px;
        border-radius: 1px;
        background: rgba(255, 255, 255, 0.8);
      }

      /* "Immersed" fullscreen: after a few seconds idle the chrome fades and
       *  the cursor hides; any pointer/key activity brings it back (see
       *  src/ui/fullscreen.ts). The HUD isn't included — it already fades
       *  itself, and a fatal error shown through it must stay readable. */
      #roomCode {
        transition: opacity 0.4s;
      }
      body.chrome-idle {
        cursor: none;
      }
      body.chrome-idle .iconBtn,
      body.chrome-idle #roomCode {
        opacity: 0;
        pointer-events: none;
      }
      /* Tap-to-start-audio prompt. One or two buttons live inside — mic-only
       * where display capture isn't offered, or a Mic/Screen choice where it
       * is (see app.ts's refreshAudioPromptButtons). Column layout so
       * #audioPromptGuide can sit under the button row.
       *
       * Restyled to the same hairline/square-corner language as the gallery
       * masthead's .gal-src and the panel's Source row (src/ui/gallery.ts,
       * src/ui/deviceMenu.ts) — this is a third picker surface, and used to
       * be the one nobody had touched: a plain pill with a white glow. This
       * file is plain HTML, not a templated stylesheet, so these values
       * (font, colors, radius) are kept in sync with src/ui/controlsTheme.ts
       * by hand rather than importing it. */
      #audioPrompt {
        position: fixed;
        left: 50%;
        bottom: 70px;
        transform: translateX(-50%);
        z-index: 6;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font: 400 13px/1.4 "Chakra Petch", system-ui, sans-serif;
        color: #fff;
      }
      #audioPromptRow {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 8px;
      }
      /* The same animated hint as the gallery masthead's .gal-source-hint
       * (src/ui/gallery.ts) — mono caps, a shimmer sweeping toward the
       * buttons and a nudging arrow — kept in sync by hand, like the rest of
       * this block. No [data-prompting] toggle needed: the whole prompt only
       * shows while nothing is listening. */
      #audioPromptLabel {
        margin-right: 10px;
        font: 400 10.5px "Share Tech Mono", ui-monospace, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        white-space: nowrap;
        color: rgba(255, 255, 255, 0.55);
      }
      .apHintArrow {
        display: inline-block;
        margin-left: 0.6em;
      }
      @media (prefers-reduced-motion: no-preference) {
        .apHintText {
          background: linear-gradient(90deg, rgba(255, 255, 255, 0.45) 40%, #fff 50%, rgba(255, 255, 255, 0.45) 60%) 100% 0 / 250% 100%;
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          animation: ap-hint-shimmer 2.6s ease-in-out infinite;
        }
        .apHintArrow {
          animation: ap-hint-nudge 1.3s ease-in-out infinite;
        }
        @keyframes ap-hint-shimmer {
          from { background-position: 100% 0; }
          to { background-position: 0 0; }
        }
        @keyframes ap-hint-nudge {
          0%, 100% { transform: translateX(0); }
          50% { transform: translateX(4px); }
        }
      }
      #audioPrompt button {
        display: flex;
        align-items: center;
        gap: 9px;
        font: inherit;
        padding: 10px 16px;
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(0, 0, 0, 0.75);
        color: inherit;
        cursor: pointer;
      }
      #audioPrompt button:hover {
        border-color: rgba(255, 255, 255, 0.4);
      }
      /* Same status-dot idiom as .gal-src-dot (src/ui/gallery.ts) and the
       * Input card's Source row (src/ui/deviceMenu.ts) — a plain border, no
       * other state: this overlay only ever shows before anything is
       * listening (updateMicPrompt in app.ts hides it the moment a capture
       * attaches), so idle is the only state either button is ever in. */
      .apDot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.45);
        box-sizing: border-box;
        flex: none;
      }
      /* Filled from DISPLAY_SHARE_GUIDE (src/audio/sourcePref.ts), which owns
       * this copy; shown only where the Screen button is offered. */
      #audioPromptGuide {
        margin: 0;
        max-width: min(420px, 88vw);
        text-align: center;
        font: 400 12px/1.45 system-ui, sans-serif;
        color: #fff9;
      }

      /* The page's h1 and product blurb are for crawlers and screen readers
       * only — the design rule for the gallery is that the mark alone carries
       * the name, with no visible title or blurb (src/ui/gallery.ts). */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <h1 class="sr-only">Sine Visuals Lab</h1>
    <p class="sr-only">
      Pick a scene from the gallery and let your microphone or a shared screen drive it — every
      setting can react to the music. Pair your phone with a TV and the visuals follow along on
      the big screen. Runs entirely in the browser; nothing to install.
    </p>
    <canvas id="gl"></canvas>
    <div id="hud"></div>
    <div id="roomCode"></div>
    <div id="sceneNav">
      <button id="backBtn" class="iconBtn" aria-label="Back to gallery">&#8249; GALLERY</button>
      <button id="stopBtn" class="iconBtn" title="Stop listening and release the audio source">STOP MIC</button>
      <button id="panelBtn" class="iconBtn" title="Screens paired to this room">&#9638; ROOM</button>
    </div>
    <button id="fsBtn" class="iconBtn" aria-label="Enter fullscreen" aria-pressed="false">&#9974;</button>
    <button id="menuBtn" class="iconBtn" aria-label="Scene menu" title="Controls (S)">&#9881;</button>
    <div id="audioPrompt">
      <div id="audioPromptRow">
        <span id="audioPromptLabel" hidden><span class="apHintText">Pick a source to start</span><span class="apHintArrow">›</span></span>
        <button id="audioPromptMicBtn"><span class="apDot"></span><span id="audioPromptMicLabel">Tap to enable mic</span></button>
        <button id="audioPromptDisplayBtn" hidden><span class="apDot"></span><span>Screen</span></button>
      </div>
      <p id="audioPromptGuide" hidden></p>
    </div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
